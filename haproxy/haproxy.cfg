global
  maxconn 4096

defaults
  mode tcp
  timeout connect 10s
  timeout client 10m
  timeout server 10m
  option clitcpka

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

listen cockroach
  bind :26257
  balance roundrobin
  option httpchk GET /health?ready=1
  server roach1 roach1:26257 check port 8080 resolvers docker init-addr libc,none
  server roach2 roach2:26257 check port 8080 resolvers docker init-addr libc,none
  server roach3 roach3:26257 check port 8080 resolvers docker init-addr libc,none

listen stats
  bind :8404
  mode http
  stats enable
  stats uri /
  stats refresh 5s
