global
  maxconn 4096
  log stdout format raw local0

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 10s
  timeout client  10m
  timeout server  10m
  timeout check   5s
  option clitcpka

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

frontend cockroach_sql
  bind :26257
  default_backend cockroach_nodes

backend cockroach_nodes
  balance roundrobin
  option httpchk
  http-check send meth GET uri /health?ready=1
  http-check expect status 200
  default-server inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server roach1 roach1:26257 check port 8080
  server roach2 roach2:26257 check port 8080
  server roach3 roach3:26257 check port 8080

frontend stats
  mode http
  bind :8404
  stats enable
  stats uri /
  stats refresh 5s
